<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0F1D2D">
  <title>Offline · EpochLex</title>
  <style>
    :root{color-scheme:light dark;--paper:#F5F2EC;--ink:#0F1D2D;--muted:#687078;--line:#D8D5CD;--accent:#7A9276}
    @media(prefers-color-scheme:dark){:root{--paper:#0F171C;--ink:#EDF0EB;--muted:#9BA7A7;--line:#29383E;--accent:#8FA68A}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}.offline-card{width:min(100%,560px);border-top:3px solid var(--accent);padding:28px 0}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:800;color:var(--accent);margin:0 0 10px}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.2rem,9vw,4rem);font-weight:500;line-height:1;margin:0 0 18px}p{color:var(--muted);margin:0 0 22px}a{display:inline-flex;align-items:center;min-height:44px;padding:10px 15px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font-weight:700}a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:3px}
  </style>
</head>
<body>
  <main class="offline-card">
    <p class="eyebrow">Dictionary of the AI Era</p>
    <h1>EpochLex</h1>
    <p>You appear to be offline. Entries and pages you have already visited may still be available. Reconnect to load anything that has not been cached yet.</p>
    <a href="./">Return to EpochLex</a>
  </main>
</body>
</html>
