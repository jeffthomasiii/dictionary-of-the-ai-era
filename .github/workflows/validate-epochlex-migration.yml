name: One-time EpochLex Migration Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feat/epochlex-brand-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epochlex-brand-migration
          fetch-depth: 0
      - name: Validate migration
        run: |
          node --check assets/js/app.js
          node --check assets/js/term-page.js
          git fetch origin main
          cmp data/terms.json <(git show origin/main:data/terms.json)
          cmp data/provenance.json <(git show origin/main:data/provenance.json)
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          terms = json.loads((root/'data/terms.json').read_text())
          prov = json.loads((root/'data/provenance.json').read_text())
          editions = json.loads((root/'data/editions.json').read_text())
          assert len(terms) == 100
          assert len(prov) == 100
          assert {t['slug'] for t in terms} == set(prov)
          assert all(prov[s]['researchStatus'] == 'researched' for s in prov)

          pages = sorted((root/'terms').glob('*/index.html'))
          assert len(pages) == 100, len(pages)
          for page in pages:
              text = page.read_text()
              assert 'EpochLex' in text, page
              assert 'AILex' not in text, page
              assert 'og:site_name' in text, page
              assert 'https://jeffthomasiii.github.io/dictionary-of-the-ai-era/' in text, page

          app = (root/'assets/js/app.js').read_text()
          termjs = (root/'assets/js/term-page.js').read_text()
          about = (root/'about.html').read_text()
          brand = (root/'BRAND.md').read_text()
          origin = (root/'docs/ORIGIN.md').read_text()
          readme = (root/'README.md').read_text()
          editions_md = (root/'EDITIONS.md').read_text()

          assert 'window.EpochLexPronunciation' in app
          assert 'AILexPronunciation' not in app
          assert '"epochlex": "epoch lex"' in app
          assert 'EpochLexPronunciation' in termjs
          assert '/EP-uk-leks/' in about
          assert 'Say “epoch” followed by “lex.”' in about
          assert '<strong>epoch</strong> with <strong>lexicon</strong>' in about
          assert '**EpochLex**' in brand and '**AILex**' in brand
          assert '**AILex**' in origin and '**EpochLex**' in origin
          assert 'EpochLex' in readme and 'AILex' in readme
          assert 'epochlex-YYYY' in editions_md
          assert editions['live']['name'] == 'EpochLex Living Dictionary'
          assert editions['policy']['editionNamePattern'] == 'EpochLex YYYY'
          assert editions['policy']['tagPattern'] == 'epochlex-YYYY'
          assert editions['planned'][0]['name'] == 'EpochLex 2026'
          assert editions['live']['canonicalUrl'] == 'https://jeffthomasiii.github.io/dictionary-of-the-ai-era/'

          allowed_old_brand = {
              pathlib.Path('BRAND.md'),
              pathlib.Path('README.md'),
              pathlib.Path('AI-TRANSPARENCY.md'),
              pathlib.Path('about.html'),
              pathlib.Path('docs/ORIGIN.md'),
          }
          stale = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html','.md','.js','.json','.txt'}:
                  continue
              text = path.read_text(errors='ignore')
              if 'AILex' in text and path not in allowed_old_brand:
                  stale.append(str(path))
              if 'ailex-YYYY' in text or 'ailex-2026' in text:
                  stale.append(str(path) + ' (old edition tag)')
          assert not stale, stale
          print('EpochLex migration validation passed.')
          PY
      - name: Remove validator and commit cleanup
        if: success()
        run: |
          rm .github/workflows/validate-epochlex-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove EpochLex migration validator"
          git push origin HEAD:feat/epochlex-brand-migration
