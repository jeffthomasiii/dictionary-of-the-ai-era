name: One-time Category Browser Validation
on:
  push:
    branches: [feat/product-readiness-category-browsing]
    paths: [.github/workflows/validate-category-browser.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate category data and JavaScript
        run: |
          node --check assets/js/categories.js
          python - <<'PY'
          import json
          from pathlib import Path
          terms=json.loads(Path('data/terms.json').read_text())
          expected={
            'AI Culture & Slang',
            'AI Ways of Working',
            'AI Systems & Technical Concepts',
            'AI Risks, Safety & Governance'
          }
          assert len(terms)==100, len(terms)
          counts={name:0 for name in expected}
          for term in terms:
            cats=term.get('categories') or []
            assert cats, term['slug']
            assert set(cats) <= expected, (term['slug'], cats)
            for cat in cats: counts[cat]+=1
          assert all(counts.values()), counts
          html=Path('categories.html').read_text()
          assert 'id="category-directory"' in html
          assert 'assets/js/categories.js' in html
          assert 'assets/css/category-browser.css' in html
          print('Validated 100 terms across category collections:', counts)
          PY
      - name: Remove one-time validation workflow
        run: |
          git config user.name "jeffthomasiii"
          git config user.email "Masterstudent@duck.com"
          git rm .github/workflows/validate-category-browser.yml
          git commit -m "chore: remove one-time category validation workflow"
          git push
