name: One-time AILex 100 Batch 5
on:
  push:
    branches: [feat/ailex-100-corpus-phase-5]
    paths: [.github/workflows/apply-corpus-batch-5.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge Batch 5 and generate pages
        shell: python
        run: |
          import json, pathlib, html
          root = pathlib.Path('.')
          terms_path = root/'data/terms.json'
          prov_path = root/'data/provenance.json'
          stage_path = root/'data/batch5-stage.json'
          roadmap_path = root/'CORPUS-ROADMAP.md'
          terms = json.loads(terms_path.read_text())
          prov = json.loads(prov_path.read_text())
          stage = json.loads(stage_path.read_text())
          existing = {t['slug'] for t in terms}
          new_slugs = [t['slug'] for t in stage['terms']]
          assert len(new_slugs) == 12
          assert len(new_slugs) == len(set(new_slugs))
          assert not (existing & set(new_slugs))
          terms.extend(stage['terms'])
          terms.sort(key=lambda t: t['term'].lower())
          prov.update(stage['provenance'])
          slugs = {t['slug'] for t in terms}
          for slug, rec in prov.items():
            rec['relatedTerms'] = [r for r in rec.get('relatedTerms', []) if r in slugs and r != slug]
          assert len(terms) == 85, len(terms)
          assert slugs == set(prov), (len(slugs), len(prov))
          for slug, rec in prov.items():
            assert rec.get('researchStatus') == 'researched', slug
            assert rec.get('sources'), slug
            for source in rec['sources']:
              assert source.get('url') and source.get('supports'), (slug, source.get('id'))
            for rel in rec.get('relatedTerms', []):
              assert rel in slugs and rel != slug, (slug, rel)
          terms_path.write_text(json.dumps(terms, ensure_ascii=False, separators=(',',':')) + '\n')
          prov_path.write_text(json.dumps(prov, ensure_ascii=False, indent=2) + '\n')
          for term in stage['terms']:
            d = root/'terms'/term['slug']
            d.mkdir(parents=True, exist_ok=True)
            title = html.escape(term['term'])
            desc = html.escape(term['definition'], quote=True)
            pron = html.escape(term['pronunciation'])
            definition = html.escape(term['definition'])
            body = f'''<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">\n<title>{title} | AILex</title><meta name="description" content="{desc}">\n<script>(()=>{{try{{const s=localStorage.getItem("ai-era-theme");const d=window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=s||(d?"dark":"light")}}catch(_){{document.documentElement.dataset.theme="light"}}}})();</script>\n<link rel="stylesheet" href="../../assets/css/styles.css"><link rel="stylesheet" href="../../assets/css/term-pages.css">\n</head><body>\n<header class="site-header"><div class="shell header-inner"><a class="brand" href="../../" aria-label="AILex home"><span class="brand-mark" aria-hidden="true">◎</span><span>AILex</span></a><nav class="primary-nav" aria-label="Primary navigation"><a class="active" href="../../">Browse</a><a href="../../categories.html">Categories</a><a href="../../about.html">About</a><a href="../../contribute.html">Contribute</a><a href="../../methodology.html">Methodology</a></nav><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><span class="sun" aria-hidden="true">☼</span><span class="toggle-track"><span class="toggle-knob"></span></span><span class="moon" aria-hidden="true">☾</span></button></div></header>\n<main id="term-page" class="term-page shell" data-term-slug="{term['slug']}"><div id="term-fallback" class="term-fallback"><nav class="term-breadcrumb" aria-label="Breadcrumb"><a href="../../">Browse</a><span aria-hidden="true">/</span><span>{title}</span></nav><p class="eyebrow">AILex entry</p><h1>{title}</h1><p class="fallback-pronunciation">{pron}</p><p class="fallback-definition">{definition}</p></div></main>\n<footer class="site-footer"><div class="shell footer-inner"><span class="footer-mark" aria-hidden="true">◎</span><p><strong>AILex · Dictionary of the AI Era</strong><br>Vibe coded · Human-directed · AI-assisted · Human-reviewed</p><p class="footer-license">Code: MIT · Content: CC BY 4.0</p></div></footer>\n<script src="../../assets/js/app.js"></script><script src="../../assets/js/term-page.js"></script></body></html>\n'''
            (d/'index.html').write_text(body)
          road = roadmap_path.read_text()
          lines = road.splitlines()
          for i, line in enumerate(lines):
            if line.startswith('AILex currently has '):
              lines[i] = 'AILex currently has 85 published, researched entries after Batch 5. The MVP corpus target is **100 published terms**, leaving 15 additional accepted entries to reach the corpus threshold.'
              break
          road = '\n'.join(lines) + '\n\n## Batch 5 — Training & Model Adaptation I\n\n1. Instruction Tuning\n2. Supervised Fine-Tuning (SFT)\n3. Reinforcement Learning\n4. Reward Model\n5. RLAIF\n6. Distillation\n7. Quantization\n8. LoRA\n9. PEFT\n10. Transfer Learning\n11. Self-Supervised Learning\n12. Supervised Learning\n\nAfter Batch 5, the published corpus reaches **85 terms**, leaving **15 terms** to the MVP threshold.\n'
          roadmap_path.write_text(road)
          stage_path.unlink()
      - name: Commit Batch 5
        run: |
          git config user.name "jeffthomasiii"
          git config user.email "Masterstudent@duck.com"
          git add -A
          git commit -m "feat: publish AILex 100 batch 5"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/apply-corpus-batch-5.yml
          git commit -m "chore: remove one-time batch 5 workflow"
          git push
