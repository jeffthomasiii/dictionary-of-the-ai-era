name: One-time Documentation and Brand Pronunciation Validation
on:
  push:
    branches: [feat/documentation-and-brand-pronunciation]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation and pronunciation
        run: |
          node --check assets/js/app.js
          python - <<'PY'
          import json
          from pathlib import Path

          terms = json.loads(Path('data/terms.json').read_text())
          provenance = json.loads(Path('data/provenance.json').read_text())
          assert len(terms) == 100
          assert len(provenance) == 100
          assert set(t['slug'] for t in terms) == set(provenance)
          assert all(r.get('researchStatus') == 'researched' for r in provenance.values())

          app = Path('assets/js/app.js').read_text()
          about = Path('about.html').read_text()
          readme = Path('README.md').read_text()
          design = Path('DESIGN.md').read_text()
          methodology = Path('methodology.html').read_text()
          contributing = Path('CONTRIBUTING.md').read_text()

          assert '"ailex": "A I lex"' in app
          assert 'ailex-pronunciation-control' in about
          assert "pronunciation.wire" in about
          assert 'browse-pronunciation.css' in about
          assert '100 published dictionary entries' in readme
          assert '100 researched provenance records' in readme
          assert 'Dedicated term pages are part of the current product' in design
          assert '100 published terms' in methodology
          assert 'Published-term completeness' in contributing

          stale = [
              'The provenance system is being introduced as a vertical slice',
              'Every other published term already has a provenance record marked `pending`',
              'Roadmap design item: dedicated term pages',
              'Roadmap design item: audible pronunciation',
              'The first researched set includes Few-Shot'
          ]
          combined = '\n'.join([readme, design, methodology])
          for phrase in stale:
              assert phrase not in combined, phrase

          print('Documentation and AILex pronunciation validation passed.')
          PY
      - name: Remove one-time validation workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-docs-pronunciation.yml
          git commit -m "chore: remove one-time documentation validator"
          git push
