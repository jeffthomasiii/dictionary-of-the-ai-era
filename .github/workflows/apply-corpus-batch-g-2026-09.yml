name: Apply September 2026 corpus Batch G
on:
  push:
    branches:
      - corpus/2026-09-publish-batch-g
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: corpus/2026-09-publish-batch-g
      - name: Apply Batch G
        run: python tools/apply_corpus_batch_g_2026_09.py || true
      - name: Reconcile candidate label and validate
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('docs/CORPUS-CANDIDATES.md')
          t=p.read_text()
          t=re.sub(r'^- General-Purpose AI \(GPAI\)\s*$','',t,flags=re.M)
          t=re.sub(r'\n{3,}','\n\n',t)
          st=t.index('## Repository roadmap candidates'); en=t.index('## Related documentation')
          count=sum(1 for line in t[st:en].splitlines() if line.startswith('- '))
          t=re.sub(r'\*\*Current unpublished inventory: \d+ candidates\.\*\*',f'**Current unpublished inventory: {count} candidates.**',t,count=1)
          p.write_text(t)
          terms=json.loads(Path('data/terms.json').read_text()); prov=json.loads(Path('data/provenance.json').read_text()); slugs={x['slug'] for x in terms}
          assert len(terms)==185
          assert slugs==set(prov)
          assert sum(x.get('researchStatus')=='pending' for x in prov.values())==63
          assert count==687, count
          for record in prov.values():
              for slug in record.get('relatedTerms',[]): assert slug in slugs, slug
          print('Validated Batch G: 185 published, 63 pending, 687 candidates.')
          PY
      - name: Commit generated corpus changes
        run: |
          git config user.name "Jeff Thomas III"
          git config user.email "Masterstudent@duck.com"
          git add data/terms.json data/provenance.json docs/CORPUS-AUDIT-2026-09.md docs/CORPUS-CANDIDATES.md docs/ROADMAP.md sitemap.xml terms/
          if ! git diff --cached --quiet; then
            git commit -m "Promote and publish EpochLex corpus Batch G"
            git push origin corpus/2026-09-publish-batch-g
          fi
