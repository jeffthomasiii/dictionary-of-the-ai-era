name: One-time EpochLex Theme Ordering
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  order:
    if: github.event.pull_request.head.ref == 'feat/epochlex-visual-system-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epochlex-visual-system-refresh
      - name: Move brand theme to final stylesheet position
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text()
              lines = text.splitlines()
              theme_lines = [line for line in lines if 'brand-theme.css' in line]
              if not theme_lines:
                  continue
              theme_line = theme_lines[0].strip()
              lines = [line for line in lines if 'brand-theme.css' not in line]
              head_end = next((i for i, line in enumerate(lines) if '</head>' in line), None)
              if head_end is None:
                  continue
              lines.insert(head_end, '  ' + theme_line)
              new = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              if new != text:
                  path.write_text(new)
                  changed += 1
          print(f'Reordered theme link on {changed} pages')
          assert changed >= 106, changed
          PY
      - name: Verify theme is final stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [Path('index.html'),Path('about.html'),Path('categories.html'),Path('contribute.html'),Path('methodology.html'),Path('404.html')]
          pages += sorted(Path('terms').glob('*/index.html'))
          for path in pages:
              lines = path.read_text().splitlines()
              style_lines = [i for i,l in enumerate(lines) if '<link' in l and 'stylesheet' in l]
              theme = [i for i,l in enumerate(lines) if 'brand-theme.css' in l]
              assert len(theme) == 1, path
              assert theme[0] == max(style_lines), path
          print(f'Validated final stylesheet ordering on {len(pages)} pages.')
          PY
      - name: Commit ordering and remove workflow
        run: |
          rm .github/workflows/reorder-epochlex-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: load EpochLex brand theme after page styles"
          git push origin HEAD:feat/epochlex-visual-system-refresh
