name: Apply named entity batch 2

on:
  push:
    branches:
      - named-entities-batch-2
    paths:
      - scripts/add_named_entities_batch2.py
      - .github/workflows/apply-named-entities-batch2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: named-entities-batch-2
          fetch-depth: 0

      - name: Apply canonical data and page changes
        run: python scripts/add_named_entities_batch2.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terms.json data/provenance.json sitemap.xml terms/google terms/gemini terms/meta terms/llama terms/xai terms/grok terms/mistral-ai terms/mistral
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add named entity batch 2"
          git push origin HEAD:named-entities-batch-2
