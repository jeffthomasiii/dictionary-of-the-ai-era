name: One-time related-term discovery validation
on:
  push:
    branches: [feat/related-term-discovery]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/related-term-discovery
          fetch-depth: 0
      - name: Validate discovery implementation
        run: |
          node --check assets/js/term-page.js
          python - <<'PY'
          import json
          from pathlib import Path
          terms = json.loads(Path('data/terms.json').read_text())
          provenance = json.loads(Path('data/provenance.json').read_text())
          slugs = {t['slug'] for t in terms}
          assert len(slugs) == 27, f'Expected 27 term slugs, found {len(slugs)}'
          assert set(provenance) == slugs, 'Provenance and term slug sets differ'
          edges = set()
          for slug, record in provenance.items():
              for related in record.get('relatedTerms', []):
                  assert related in slugs, f'Broken related slug: {slug} -> {related}'
                  assert related != slug, f'Self-link found: {slug}'
                  edges.add(tuple(sorted((slug, related))))
          assert edges, 'No relationship edges found'
          assert Path('assets/css/related-discovery.css').exists(), 'Related discovery stylesheet missing'
          print(f'Validated 27 terms and {len(edges)} unique relationship connections')
          PY
          rm .github/workflows/validate-related-discovery.yml
      - name: Remove one-time validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-time related discovery validator"
          git push origin HEAD:feat/related-term-discovery
