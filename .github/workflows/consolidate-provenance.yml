name: One-time provenance consolidation

on:
  push:
    branches:
      - feat/provenance-consolidation

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/provenance-consolidation
          fetch-depth: 0

      - name: Consolidate and validate provenance
        shell: python
        run: |
          import json
          from pathlib import Path

          data_dir = Path('data')
          canonical_path = data_dir / 'provenance.json'
          culture_path = data_dir / 'provenance-culture-workflow.json'
          risk_path = data_dir / 'provenance-risk-governance.json'
          terms_path = data_dir / 'terms.json'

          canonical = json.loads(canonical_path.read_text(encoding='utf-8'))
          culture = json.loads(culture_path.read_text(encoding='utf-8'))
          risk = json.loads(risk_path.read_text(encoding='utf-8'))
          terms = json.loads(terms_path.read_text(encoding='utf-8'))

          overlap = (set(culture) & set(risk))
          if overlap:
              raise SystemExit(f'Batch overlap detected: {sorted(overlap)}')

          canonical.update(culture)
          canonical.update(risk)

          published_slugs = [term['slug'] for term in terms]
          published_set = set(published_slugs)
          provenance_set = set(canonical)

          missing = published_set - provenance_set
          extra = provenance_set - published_set
          if missing or extra:
              raise SystemExit(f'Coverage mismatch. Missing={sorted(missing)} Extra={sorted(extra)}')

          pending = [slug for slug, record in canonical.items() if record.get('researchStatus') != 'researched']
          if pending:
              raise SystemExit(f'Non-researched records remain: {sorted(pending)}')

          invalid_related = []
          invalid_sources = []
          duplicate_source_ids = []
          for slug, record in canonical.items():
              for related in record.get('relatedTerms', []):
                  if related not in published_set:
                      invalid_related.append((slug, related))

              seen_ids = set()
              sources = record.get('sources') or []
              if not sources:
                  invalid_sources.append((slug, 'no sources'))
              for source in sources:
                  source_id = source.get('id')
                  if not source_id or not source.get('url') or not source.get('supports'):
                      invalid_sources.append((slug, source_id or '<missing id>'))
                  if source_id in seen_ids:
                      duplicate_source_ids.append((slug, source_id))
                  seen_ids.add(source_id)

          if invalid_related:
              raise SystemExit(f'Invalid related-term slugs: {invalid_related}')
          if invalid_sources:
              raise SystemExit(f'Invalid source records: {invalid_sources}')
          if duplicate_source_ids:
              raise SystemExit(f'Duplicate source ids within records: {duplicate_source_ids}')

          ordered = {slug: canonical[slug] for slug in published_slugs}
          canonical_path.write_text(json.dumps(ordered, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          culture_path.unlink()
          risk_path.unlink()
          Path('.github/workflows/consolidate-provenance.yml').unlink()

          print(f'Validated {len(ordered)} published terms')
          print(f'Researched: {sum(r.get("researchStatus") == "researched" for r in ordered.values())}/{len(ordered)}')
          print(f'Sources: {sum(len(r.get("sources", [])) for r in ordered.values())}')

      - name: Commit consolidated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: consolidate 27-term provenance dataset"
          git push origin HEAD:feat/provenance-consolidation
