name: Apply named entity batch 1

on:
  push:
    branches:
      - named-entities-batch-1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply named entity batch 1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: named-entities-batch-1

      - name: Apply canonical data and page changes
        run: python scripts/add_named_entities_batch1.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terms.json data/provenance.json sitemap.xml terms/
          git commit -m "Apply named entity batch 1"
          git push origin named-entities-batch-1
