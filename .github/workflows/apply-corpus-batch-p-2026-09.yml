name: Apply September 2026 corpus Batch P
on:
  push:
    branches:
      - corpus/2026-09-publish-batch-p
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: corpus/2026-09-publish-batch-p
      - name: Reconcile unpublished related-term reference
        run: sed -i "s/'ai-security'/'agent-security'/" tools/apply_corpus_batch_p_2026_09.py
      - name: Apply and validate Batch P
        run: python tools/apply_corpus_batch_p_2026_09.py
      - name: Commit generated corpus changes
        run: |
          git config user.name "Jeff Thomas III"
          git config user.email "Masterstudent@duck.com"
          git add data/terms.json data/provenance.json docs/CORPUS-AUDIT-2026-09.md docs/CORPUS-CANDIDATES.md docs/ROADMAP.md sitemap.xml terms/
          if ! git diff --cached --quiet; then
            git commit -m "Promote and publish EpochLex corpus Batch P"
            git push origin corpus/2026-09-publish-batch-p
          fi
