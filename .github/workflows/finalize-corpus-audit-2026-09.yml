name: Finalize September 2026 corpus audit

on:
  push:
    branches:
      - corpus/2026-09-expansion-audit
    paths:
      - tools/finalize_corpus_audit_2026_09.py
      - .github/workflows/finalize-corpus-audit-2026-09.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: corpus/2026-09-expansion-audit
          fetch-depth: 0
      - name: Finalize and validate audit
        run: python tools/finalize_corpus_audit_2026_09.py
      - name: Commit finalized audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/provenance.json docs/CORPUS-CANDIDATES.md
          if git diff --cached --quiet; then
            echo "No finalization changes to commit."
          else
            git commit -m "Finalize corpus audit inventory and provenance diff"
            git push origin HEAD:corpus/2026-09-expansion-audit
          fi
