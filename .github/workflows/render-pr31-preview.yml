name: Temporary PR31 Visual Preview
on:
  push:
    branches: [feat/epochlex-visual-system-refresh]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  render:
    if: github.ref_name == 'feat/epochlex-visual-system-refresh' && !contains(github.event.head_commit.message || '', '[skip preview]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epochlex-visual-system-refresh
          fetch-depth: 0
      - name: Sync uploaded production brand assets from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X ours --no-edit origin/main
      - name: Integrate production EpochLex masthead
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [Path('index.html'), Path('about.html'), Path('categories.html'), Path('contribute.html'), Path('methodology.html')]
          pages += sorted(Path('terms').glob('*/index.html'))

          updated = 0
          for path in pages:
              text = path.read_text()
              prefix = '' if path.parent == Path('.') else '../../'
              light = f"{prefix}assets/brand/epochlex/epochlex-logo-horizontal-light.png"
              dark = f"{prefix}assets/brand/epochlex/epochlex-logo-horizontal-dark.png"
              replacement = (
                  '<span class="brand-lockup" aria-hidden="true">'
                  f'<img class="brand-lockup-image brand-lockup-light" src="{light}" alt="">'
                  f'<img class="brand-lockup-image brand-lockup-dark" src="{dark}" alt="">'
                  '</span><span class="sr-only">EpochLex</span>'
              )
              if 'brand-lockup-light' in text:
                  continue
              pattern = re.compile(r'<span class="brand-mark"(?: aria-hidden="true")?>.*?</span>\s*<span>EpochLex</span>', re.S)
              new, count = pattern.subn(replacement, text, count=1)
              if count == 1:
                  path.write_text(new)
                  updated += 1
          print(f'Integrated production masthead on {updated} pages')

          css = Path('assets/css/brand-theme.css')
          text = css.read_text()
          marker = '/* Production EpochLex masthead lockup */'
          if marker not in text:
              text += '''\n\n/* Production EpochLex masthead lockup */\n.brand { min-width: 0; }\n.brand-lockup { display:block; width:clamp(160px,18vw,230px); line-height:0; }\n.brand-lockup-image { display:block; width:100%; height:auto; }\n.brand-lockup-dark { display:none; }\nhtml[data-theme="dark"] .brand-lockup-light { display:none; }\nhtml[data-theme="dark"] .brand-lockup-dark { display:block; }\n@media (max-width:680px){ .brand-lockup { width:158px; } }\n'''
              css.write_text(text)
          PY
      - name: Validate production logo wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'epochlex-logo-horizontal-light.png',
              'epochlex-logo-horizontal-dark.png',
              'epochlex-logo-stacked-light.png',
              'epochlex-logo-stacked-pronunciation-light.png',
              'epochlex-mark-light.png',
              'epochlex-mark-dark.png',
          ]
          root = Path('assets/brand/epochlex')
          for filename in required:
              f = root / filename
              assert f.exists() and f.stat().st_size > 0, f
          pages = [Path('index.html'), Path('about.html'), Path('categories.html'), Path('contribute.html'), Path('methodology.html')]
          pages += sorted(Path('terms').glob('*/index.html'))
          for path in pages:
              t = path.read_text()
              assert 'brand-lockup-light' in t and 'brand-lockup-dark' in t, path
              assert '<span class="brand-mark"' not in t, path
          print(f'Validated logo wiring on {len(pages)} pages')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render branch screenshots
        run: |
          mkdir -p .preview/pr31
          python3 -m http.server 4173 >/tmp/epochlex-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > render-pr31-preview.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          async function shot(name, width, height, theme) {
            const context = await browser.newContext({viewport:{width,height}, deviceScaleFactor:1});
            const page = await context.newPage();
            await page.addInitScript(value => localStorage.setItem('ai-era-theme', value), theme);
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            await page.screenshot({path:`.preview/pr31/${name}.png`, fullPage:true});
            await context.close();
          }
          await shot('mobile-light', 412, 915, 'light');
          await shot('mobile-dark', 412, 915, 'dark');
          await shot('desktop-light', 1440, 1000, 'light');
          await shot('desktop-dark', 1440, 1000, 'dark');
          await browser.close();
          JS
          node render-pr31-preview.mjs
          rm render-pr31-preview.mjs
      - name: Commit integrated assets and refreshed previews
        run: |
          rm -f .github/workflows/integrate-epochlex-brand-assets.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate EpochLex production logo and refresh previews [skip preview]"
          git push origin HEAD:feat/epochlex-visual-system-refresh
