name: Temporary PR31 Visual Preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  render:
    if: github.event.pull_request.head.ref == 'feat/epochlex-visual-system-refresh' && !contains(github.event.head_commit.message || '', '[skip preview]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epochlex-visual-system-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render branch screenshots
        run: |
          mkdir -p .preview/pr31
          python3 -m http.server 4173 >/tmp/epochlex-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/render.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          async function shot(name, width, height, theme) {
            const context = await browser.newContext({viewport:{width,height}, deviceScaleFactor:1});
            const page = await context.newPage();
            await page.addInitScript(value => localStorage.setItem('ai-era-theme', value), theme);
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            await page.screenshot({path:`.preview/pr31/${name}.png`, fullPage:true});
            await context.close();
          }
          await shot('mobile-light', 412, 915, 'light');
          await shot('mobile-dark', 412, 915, 'dark');
          await shot('desktop-light', 1440, 1000, 'light');
          await shot('desktop-dark', 1440, 1000, 'dark');
          await browser.close();
          JS
          node /tmp/render.mjs
      - name: Commit temporary previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .preview/pr31/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: add PR31 visual previews [skip preview]"
          git push origin HEAD:feat/epochlex-visual-system-refresh
