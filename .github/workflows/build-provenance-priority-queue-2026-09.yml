name: Build September 2026 provenance priority queue
on:
  push:
    branches:
      - research/2026-09-provenance-prioritization
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: research/2026-09-provenance-prioritization
      - name: Build and validate queue
        run: python tools/build_provenance_priority_queue_2026_09.py
      - name: Commit generated queue
        run: |
          git config user.name "Jeff Thomas III"
          git config user.email "Masterstudent@duck.com"
          git add docs/PROVENANCE-REVIEW-QUEUE-2026-09.md
          if ! git diff --cached --quiet; then
            git commit -m "Prioritize pending provenance review queue"
            git push origin research/2026-09-provenance-prioritization
          fi
