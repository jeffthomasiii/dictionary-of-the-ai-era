name: Normalize batch 2 provenance

on:
  push:
    branches:
      - named-entities-batch-2
    paths:
      - scripts/normalize_batch2_provenance.py
      - .github/workflows/normalize-batch2-provenance.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: named-entities-batch-2
          fetch-depth: 0
      - run: git fetch origin main
      - run: python scripts/normalize_batch2_provenance.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/provenance.json
          git commit -m "Keep batch 2 provenance diff focused"
          git push origin HEAD:named-entities-batch-2
