name: One-time EpochLex Brand Migration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'feat/epochlex-brand-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epochlex-brand-migration
          fetch-depth: 0
      - name: Migrate current brand references
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          protected = {
              Path('BRAND.md'),
              Path('README.md'),
              Path('AI-TRANSPARENCY.md'),
              Path('EDITIONS.md'),
              Path('docs/ORIGIN.md'),
          }

          candidates = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in protected:
                  continue
              if path in {Path('data/terms.json'), Path('data/provenance.json')}:
                  continue
              if path.suffix.lower() in {'.html', '.md', '.js', '.json'}:
                  candidates.append(path)

          replacements = [
              ('window.AILexPronunciation', 'window.EpochLexPronunciation'),
              ('AILexPronunciation', 'EpochLexPronunciation'),
              ('ailex-pronunciation-control', 'epochlex-pronunciation-control'),
              ('"ailex": "A I lex"', '"epochlex": "epoch lex"'),
              ("slug: 'ailex'", "slug: 'epochlex'"),
              ('/A-I-lex/', '/EP-uk-leks/'),
              ('ailex-YYYY', 'epochlex-YYYY'),
              ('ailex-2026', 'epochlex-2026'),
              ('AILex', 'EpochLex'),
          ]

          changed = []
          for path in candidates:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} files')
          for path in changed:
              print(path)
          PY
      - name: Remove one-time migration workflow
        run: rm .github/workflows/migrate-epochlex-brand.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate published identity to EpochLex"
          git push origin HEAD:feat/epochlex-brand-migration
