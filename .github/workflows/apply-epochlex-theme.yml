name: One-time EpochLex Theme Applicator
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/epochlex-visual-system-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epochlex-visual-system-refresh
      - name: Apply brand theme stylesheet to all public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          changed = []
          for path in root.rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text()
              if 'brand-theme.css' in text:
                  continue
              marker = 'assets/css/styles.css'
              idx = text.find(marker)
              if idx < 0:
                  continue
              link_start = text.rfind('<link', 0, idx)
              link_end = text.find('>', idx)
              if link_start < 0 or link_end < 0:
                  continue
              styles_link = text[link_start:link_end+1]
              href_start = styles_link.find('href="') + 6
              href_end = styles_link.find('"', href_start)
              href = styles_link[href_start:href_end]
              theme_href = href.replace('styles.css', 'brand-theme.css')
              insertion = f'\n  <link rel="stylesheet" href="{theme_href}">'
              text = text[:link_end+1] + insertion + text[link_end+1:]
              path.write_text(text)
              changed.append(str(path))
          print(f'Updated {len(changed)} HTML files')
          assert len(changed) >= 105, len(changed)
          PY
      - name: Validate theme coverage
        run: |
          python - <<'PY'
          import pathlib, json
          root = pathlib.Path('.')
          pages = [p for p in root.rglob('*.html') if '.git' not in p.parts]
          public = [p for p in pages if p.name in {'index.html','about.html','categories.html','contribute.html','methodology.html','404.html'} or 'terms' in p.parts]
          missing = [str(p) for p in public if 'brand-theme.css' not in p.read_text()]
          assert not missing, missing
          terms = json.loads((root/'data/terms.json').read_text())
          prov = json.loads((root/'data/provenance.json').read_text())
          assert len(terms) == 100 and len(prov) == 100
          assert {t['slug'] for t in terms} == set(prov)
          css = (root/'assets/css/brand-theme.css').read_text()
          for value in ['#F5F2EC','#0F1D2D','#2B333B','#7A9276','#5C8F95','#E4E0DB','#A7AEB3','Playfair Display','Inter']:
              assert value in css, value
          print(f'Theme coverage validated across {len(public)} public pages.')
          PY
      - name: Commit theme wiring and remove applicator
        run: |
          rm .github/workflows/apply-epochlex-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply EpochLex visual system across site"
          git push origin HEAD:feat/epochlex-visual-system-refresh
