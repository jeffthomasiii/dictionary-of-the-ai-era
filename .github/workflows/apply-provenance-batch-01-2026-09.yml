name: Apply September 2026 provenance Batch 01
on:
  push:
    branches:
      - research/2026-09-provenance-batch-01
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: research/2026-09-provenance-batch-01
      - name: Apply and validate provenance Batch 01
        run: python tools/apply_provenance_batch_01_2026_09.py
      - name: Commit researched provenance records
        run: |
          git config user.name "Jeff Thomas III"
          git config user.email "Masterstudent@duck.com"
          git add data/provenance.json data/terms.json docs/ROADMAP.md docs/PROVENANCE-REVIEW-QUEUE-2026-09.md
          if ! git diff --cached --quiet; then
            git commit -m "Complete EpochLex provenance research Batch 01"
            git push origin research/2026-09-provenance-batch-01
          fi
