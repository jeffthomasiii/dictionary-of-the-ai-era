name: Apply September 2026 corpus Batch C
on:
  push:
    branches:
      - corpus/2026-09-publish-batch-c
    paths:
      - tools/apply_corpus_batch_c_2026_09.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: corpus/2026-09-publish-batch-c
      - name: Apply and validate Batch C
        run: python tools/apply_corpus_batch_c_2026_09.py
      - name: Commit generated corpus changes
        run: |
          git config user.name "Jeff Thomas III"
          git config user.email "Masterstudent@duck.com"
          git add data/terms.json data/provenance.json docs/CORPUS-CANDIDATES.md docs/CORPUS-AUDIT-2026-09.md docs/ROADMAP.md sitemap.xml terms
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Publish EpochLex corpus Batch C"
            git push origin HEAD:corpus/2026-09-publish-batch-c
          fi