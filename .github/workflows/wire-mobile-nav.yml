name: One-time mobile navigation wiring

on:
  push:
    branches: [feat/mobile-navigation]
    paths: [.github/workflows/wire-mobile-nav.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-navigation
          fetch-depth: 0
      - name: Wire and validate mobile navigation
        shell: python
        run: |
          from pathlib import Path

          app = Path('assets/js/app.js')
          text = app.read_text(encoding='utf-8')
          marker = 'data-mobile-navigation-loader'
          if marker not in text:
              loader = '''\n\n(() => {\n  if (document.querySelector('script[data-mobile-navigation-loader]')) return;\n  const source = document.currentScript?.src;\n  if (!source) return;\n  const script = document.createElement('script');\n  script.src = new URL('mobile-nav.js', source).href;\n  script.dataset.mobileNavigationLoader = 'true';\n  document.head.append(script);\n})();\n'''
              app.write_text(text + loader, encoding='utf-8')

          reader_pages = []
          missing_app = []
          for page in Path('.').rglob('*.html'):
              html = page.read_text(encoding='utf-8')
              if 'site-header' not in html:
                  continue
              reader_pages.append(str(page))
              if 'assets/js/app.js' not in html:
                  missing_app.append(str(page))

          if missing_app:
              raise SystemExit(f'Reader pages missing shared app.js: {missing_app}')
          if len(reader_pages) < 32:
              raise SystemExit(f'Expected at least 32 reader pages with headers, found {len(reader_pages)}')
          if not Path('assets/js/mobile-nav.js').exists() or not Path('assets/css/mobile-nav.css').exists():
              raise SystemExit('Mobile navigation assets are missing')

          Path('.github/workflows/wire-mobile-nav.yml').unlink()
          print(f'Validated mobile navigation coverage across {len(reader_pages)} reader pages')
      - name: Commit wired navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enable mobile navigation across AILex"
          git push origin HEAD:feat/mobile-navigation
