name: One-time EpochLex Brand Asset Integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feat/epochlex-visual-system-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epochlex-visual-system-refresh
          fetch-depth: 0
      - name: Sync branch with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Integrate production logo assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          public_pages = [Path('index.html'), Path('about.html'), Path('categories.html'), Path('contribute.html'), Path('methodology.html')]
          public_pages += sorted(Path('terms').glob('*/index.html'))

          changed = 0
          for path in public_pages:
              text = path.read_text()
              prefix = '../' if path.parent == Path('.') else '../../'
              if path.parent == Path('.'):
                  prefix = ''
              light = f"{prefix}assets/brand/epochlex/epochlex-logo-horizontal-light.png"
              dark = f"{prefix}assets/brand/epochlex/epochlex-logo-horizontal-dark.png"
              replacement = (
                  '<span class="brand-lockup" aria-hidden="true">'
                  f'<img class="brand-lockup-image brand-lockup-light" src="{light}" alt="">'
                  f'<img class="brand-lockup-image brand-lockup-dark" src="{dark}" alt="">'
                  '</span><span class="sr-only">EpochLex</span>'
              )
              pattern = re.compile(
                  r'<span class="brand-mark" aria-hidden="true">.*?</span>\s*<span>EpochLex</span>',
                  re.S,
              )
              new, count = pattern.subn(replacement, text, count=1)
              if count == 1 and new != text:
                  path.write_text(new)
                  changed += 1
          print(f'Updated production masthead logo on {changed} public pages')
          assert changed == len(public_pages), (changed, len(public_pages))
          PY

          cat >> assets/css/brand-theme.css <<'CSS'

          /* Production EpochLex masthead lockup */
          .brand {
            min-width: 0;
          }
          .brand-lockup {
            display: block;
            width: clamp(148px, 16vw, 205px);
            line-height: 0;
          }
          .brand-lockup-image {
            display: block;
            width: 100%;
            height: auto;
          }
          .brand-lockup-dark { display: none; }
          html[data-theme="dark"] .brand-lockup-light { display: none; }
          html[data-theme="dark"] .brand-lockup-dark { display: block; }
          @media (max-width: 680px) {
            .brand-lockup { width: 150px; }
          }
          CSS
      - name: Validate brand assets and references
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'epochlex-logo-horizontal-light.png',
              'epochlex-logo-horizontal-dark.png',
              'epochlex-logo-stacked-light.png',
              'epochlex-logo-stacked-pronunciation-light.png',
              'epochlex-mark-light.png',
              'epochlex-mark-dark.png',
          ]
          brand = Path('assets/brand/epochlex')
          for name in required:
              path = brand / name
              assert path.exists() and path.stat().st_size > 0, path
          pages = [Path('index.html'), Path('about.html'), Path('categories.html'), Path('contribute.html'), Path('methodology.html')]
          pages += sorted(Path('terms').glob('*/index.html'))
          for path in pages:
              text = path.read_text()
              assert 'brand-lockup-light' in text and 'brand-lockup-dark' in text, path
              assert '<span class="brand-mark"' not in text, path
          print(f'Validated production logo wiring on {len(pages)} pages.')
          PY
      - name: Remove temporary integration workflow and push
        run: |
          rm .github/workflows/integrate-epochlex-brand-assets.yml
          git add -A
          git commit -m "feat: integrate production EpochLex masthead assets"
          git push origin HEAD:feat/epochlex-visual-system-refresh
