name: One-time AILex 100 Batch 6

on:
  push:
    branches:
      - feat/ailex-100-corpus-phase-6
    paths:
      - .github/workflows/apply-corpus-batch-6.yml
      - scripts/apply_batch6.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish final MVP corpus batch
        run: python scripts/apply_batch6.py
      - name: Commit Batch 6
        run: |
          git config user.name "jeffthomasiii"
          git config user.email "Masterstudent@duck.com"
          git add -A
          git commit -m "feat: publish AILex 100 final MVP batch"
          git push
      - name: Remove temporary batch tooling
        run: |
          git rm .github/workflows/apply-corpus-batch-6.yml scripts/apply_batch6.py
          git commit -m "chore: remove temporary batch 6 tooling"
          git push
